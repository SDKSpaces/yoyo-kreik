<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoyo & Kreik — Counter Poster</title>
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Oxanium:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --red: #e3121c; --hex: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #1a1a1a; }
  body { font-family: "Cairo", system-ui, sans-serif; color: #fff; padding: 16px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet {
    position: relative;
    background: radial-gradient(90% 60% at 50% 30%, #1c0507 0%, #000 60%);
    max-width: 560px;
    margin: 0 auto;
    border-radius: 18px;
    overflow: hidden;
    text-align: center;
    border-top: 4px solid var(--red);
    border-bottom: 4px solid var(--red);
  }
  .inner { padding: 34px 24px 36px; }
  .logo { width: 150px; height: 150px; border-radius: 50%; display: block; margin: 0 auto 14px; box-shadow: 0 0 50px rgba(227,18,28,0.3); }
  .wordmark { font-family: "Oxanium", sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.08em; direction: ltr; }
  .wordmark em { font-style: normal; color: var(--red); }
  h1 { margin: 18px 0 2px; font-size: 34px; line-height: 1.2; }
  .en h1 { font-family: "Oxanium", sans-serif; font-size: 26px; text-transform: uppercase; letter-spacing: 0.04em; }
  h1 b { color: var(--red); }
  .sub { margin: 0; font-size: 16px; color: #a8a8a8; }
  #qr { display: inline-block; margin: 24px 0 20px; padding: 14px; background: #fff; border-radius: 16px; line-height: 0; border: 3px solid var(--red); }
  .hexes { display: flex; justify-content: center; gap: 6px; margin: 0 0 22px; }
  .hexes i { width: 20px; height: 23px; clip-path: var(--hex); background: #444; position: relative; }
  .hexes i::before { content: ""; position: absolute; inset: 2px; clip-path: var(--hex); background: #000; }
  .hexes i.f, .hexes i.f::before { background: var(--red); }
  .print { display: block; margin: 16px auto; font: inherit; font-weight: 700; padding: 10px 22px; border-radius: 10px; border: 0; background: var(--red); color: #fff; cursor: pointer; }
  @media print {
    html, body { background: #000; padding: 0; }
    .sheet { max-width: none; border-radius: 0; }
    .print { display: none; }
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="inner">
    <img class="logo" src="img/logo.jpg" alt="Yoyo & Kreik">
    <div class="wordmark" id="wordmark"></div>
    <div dir="rtl">
      <h1 id="arTitle"></h1>
      <p class="sub" id="arSub"></p>
    </div>
    <div id="qr"></div>
    <div class="hexes" id="hexes"></div>
    <div class="en" dir="ltr">
      <h1 id="enTitle"></h1>
      <p class="sub" id="enSub"></p>
    </div>
  </div>
</div>
<button class="print" onclick="print()">Print / طباعة</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
  const max = APP_CONFIG.stampsNeeded;
  const tt = (lang, key) => STRINGS[lang][key].split("10").join(max);
  const wm = document.getElementById("wordmark");
  APP_CONFIG.shopName.en.toUpperCase().split("&").forEach((part, i) => {
    if (i) { const em = document.createElement("em"); em.textContent = "&"; wm.appendChild(em); }
    wm.appendChild(document.createTextNode(part));
  });
  document.getElementById("arTitle").textContent = tt("ar", "posterTitle");
  document.getElementById("arSub").textContent = tt("ar", "posterSub");
  document.getElementById("enTitle").textContent = tt("en", "posterTitle");
  document.getElementById("enSub").textContent = tt("en", "posterSub");
  const hexes = document.getElementById("hexes");
  for (let i = 0; i < max; i++) {
    const d = document.createElement("i");
    if (i === max - 1) d.className = "f";
    hexes.appendChild(d);
  }
  new QRCode(document.getElementById("qr"), {
    text: new URL("index.html", location.href).href,
    width: 240, height: 240, colorDark: "#000000", colorLight: "#ffffff"
  });
</script>
</body>
</html>
